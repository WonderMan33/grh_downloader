<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Golden Radio Hour – Show Archive Downloads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #05060a;
      --panel: #111627;
      --border: #262b3f;
      --accent: #f5c35b;
      --accent-soft: rgba(245, 195, 91, 0.18);
      --text: #f7f7fb;
      --text-soft: #a3a8c2;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #141a2f 0, #05060a 40%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: 0.03em;
    }

    .logo-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(245, 195, 91, 0.9);
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: var(--text-soft);
    }

    .pill {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 0.78rem;
      color: var(--text-soft);
      background: linear-gradient(
        120deg,
        rgba(245, 195, 91, 0.14),
        rgba(15, 23, 42, 0.96)
      );
      white-space: nowrap;
    }

    .panel {
      background: radial-gradient(circle at top left, rgba(148, 163, 255, 0.08), rgba(10, 16, 30, 0.98));
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 230px;
    }

    .search-box input {
      flex: 1;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      padding: 7px 11px;
      background: rgba(10, 16, 30, 0.98);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: #6b7280;
    }

    .search-box button {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.96);
      color: var(--text-soft);
      font-size: 0.8rem;
      padding: 7px 11px;
      cursor: pointer;
    }

    .count-label {
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .list {
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .card {
      border-radius: var(--radius-md);
      border: 1px solid rgba(38, 43, 63, 0.9);
      background: rgba(8, 13, 26, 0.97);
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .show-name {
      margin: 0;
      font-size: 1rem;
    }

    .show-id {
      font-size: 0.74rem;
      color: var(--text-soft);
      opacity: 0.85;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .btn {
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.98);
      color: var(--text-soft);
      font-size: 0.8rem;
      padding: 7px 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 500;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--text-soft);
      opacity: 0.85;
      margin-top: 2px;
    }

    .empty {
      font-size: 0.9rem;
      color: var(--text-soft);
      text-align: center;
      padding: 20px 10px;
    }

    code {
      font-size: 0.8rem;
      background: rgba(17, 24, 39, 0.9);
      padding: 2px 4px;
      border-radius: 4px;
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
      }
      .pill {
        width: 100%;
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>
          <span class="logo-dot"></span>
          Golden Radio Hour – Show Downloads
        </h1>
        <p>Download complete show archives as ZIP files for your own collection.</p>
      </div>
      <div class="pill">
        Listener tools · Full-show ZIP archives
      </div>
    </header>

    <section class="panel">
      <div class="top-row">
        <div class="search-box">
          <input
            id="searchInput"
            type="text"
            placeholder="Search shows by name or ID…"
          />
          <button type="button" id="clearBtn">Clear</button>
        </div>
        <div class="count-label" id="countLabel">Loading…</div>
      </div>

      <div class="list" id="showList"></div>

      <div class="hint">
        Tip: If your browser opens the ZIP instead of saving it, right-click the download button and choose
        <strong>“Save link as…”</strong>.
      </div>
    </section>
  </div>

  <script>
    // JSON this page expects: zipped_shows.json
    // Format per entry:
    // { "id": "ShowFolderName", "zipUrl": "https://.../ShowFolderName.zip", ...optional fields }
    const JSON_URL = "zipped_shows.json";

    let allShows = [];
    let filteredShows = [];

    const showListEl = document.getElementById("showList");
    const searchInputEl = document.getElementById("searchInput");
    const clearBtnEl = document.getElementById("clearBtn");
    const countLabelEl = document.getElementById("countLabel");

    async function loadShows() {
      try {
        const res = await fetch(JSON_URL, { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        allShows = Array.isArray(data) ? data : [];
        filteredShows = [...allShows];
        renderList();
      } catch (err) {
        console.error("Failed to load zipped_shows.json", err);
        showListEl.innerHTML = `
          <div class="empty">
            Could not load <code>zipped_shows.json</code>.<br/>
            Make sure it’s in the same folder as this HTML file.
          </div>
        `;
        countLabelEl.textContent = "Error loading shows";
      }
    }

    function applyFilter() {
      const q = searchInputEl.value.trim().toLowerCase();
      filteredShows = allShows.filter(show => {
        const id = (show.id || "").toLowerCase();
        const name = (show.name || "").toLowerCase();
        return !q || id.includes(q) || name.includes(q);
      });
      renderList();
    }

    function safeName(show) {
      if (show.name && show.name.trim().length > 0) {
        return show.name;
      }
      return show.id || "Untitled Show";
    }

    function renderList() {
      showListEl.innerHTML = "";

      if (!filteredShows.length) {
        showListEl.innerHTML = `
          <div class="empty">
            No shows match your search. Try clearing the search box.
          </div>
        `;
        countLabelEl.textContent = "0 shows";
        return;
      }

      filteredShows.forEach(show => {
        const card = document.createElement("div");
        card.className = "card";

        const header = document.createElement("div");
        header.className = "card-header";

        const title = document.createElement("h2");
        title.className = "show-name";
        title.textContent = safeName(show);

        const idLabel = document.createElement("div");
        idLabel.className = "show-id";
        idLabel.textContent = show.id || "";

        header.appendChild(title);
        header.appendChild(idLabel);

        const btnRow = document.createElement("div");
        btnRow.className = "btn-row";

        if (show.zipUrl) {
          const a = document.createElement("a");
          a.className = "btn btn-primary";
          a.href = encodeURI(show.zipUrl);
          a.setAttribute("download", "");
          a.textContent = "Download full show (ZIP)";
          btnRow.appendChild(a);
        } else {
          const span = document.createElement("span");
          span.className = "btn";
          span.textContent = "No ZIP URL configured";
          btnRow.appendChild(span);
        }

        card.appendChild(header);
        card.appendChild(btnRow);

        showListEl.appendChild(card);
      });

      countLabelEl.textContent =
        filteredShows.length + (filteredShows.length === 1 ? " show" : " shows");
    }

    searchInputEl.addEventListener("input", applyFilter);
    clearBtnEl.addEventListener("click", () => {
      searchInputEl.value = "";
      applyFilter();
    });

    loadShows();
  </script>
</body>
</html>
