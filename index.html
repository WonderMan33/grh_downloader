<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Golden Radio Hour – Show Downloads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --red: #b5121b;
      --red-dark: #941018;
      --gold: #d99b20;
      --black: #171717;
      --text: #222222;
      --muted: #666666;
      --border: #dddddd;
      --soft: #f7f7f7;
      --white: #ffffff;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #ffffff;
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px 10px 14px;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;

      padding: 4px 2px 12px;
      margin-bottom: 10px;

      border-bottom: 3px solid var(--red);
    }

    .title-wrap {
      min-width: 0;
    }

    h1 {
      margin: 0;

      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 1.35rem;
      line-height: 1.2;
      font-weight: 800;

      color: var(--black);
    }

    .logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;

      background: var(--gold);

      flex: 0 0 auto;
    }

    header p {
      margin: 4px 0 0;

      font-size: .82rem;
      line-height: 1.35;

      color: var(--muted);
    }

    .pill {
      flex: 0 0 auto;

      padding: 5px 10px;

      border: 1px solid #e0c487;
      border-radius: 4px;

      background: #fffaf0;

      color: #775a18;

      font-size: .72rem;
      font-weight: 700;

      white-space: nowrap;
    }

    /* MAIN PANEL */

    .panel {
      background: var(--white);

      border: 1px solid var(--border);
      border-radius: 7px;

      box-shadow: var(--shadow);

      padding: 10px;
    }

    /* SEARCH */

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }

    .search-box {
      display: flex;
      align-items: stretch;

      flex: 1;

      gap: 6px;

      min-width: 0;
    }

    .search-box input {
      flex: 1;
      min-width: 0;

      height: 38px;

      padding: 7px 10px;

      border: 1px solid #cccccc;
      border-radius: 4px;

      background: #ffffff;
      color: var(--text);

      font-family: inherit;
      font-size: .85rem;

      outline: none;
    }

    .search-box input:focus {
      border-color: var(--red);

      box-shadow:
        0 0 0 2px rgba(181,18,27,.08);
    }

    .search-box input::placeholder {
      color: #8a8a8a;
    }

    .search-box button {
      height: 38px;

      padding: 0 14px;

      border: 1px solid var(--red);
      border-radius: 4px;

      background: #ffffff;
      color: var(--red);

      font-family: inherit;
      font-size: .78rem;
      font-weight: 800;

      cursor: pointer;

      transition:
        background .15s ease,
        color .15s ease;
    }

    .search-box button:hover {
      background: var(--red);
      color: #ffffff;
    }

    .count-label {
      flex: 0 0 auto;

      font-size: .76rem;
      font-weight: 700;

      color: var(--muted);

      white-space: nowrap;
    }

    /* SHOW LIST */

    .list {
      max-height: 600px;

      overflow-y: auto;
      overflow-x: hidden;

      padding-right: 3px;

      scrollbar-width: thin;
      scrollbar-color: #bbbbbb transparent;
    }

    .list::-webkit-scrollbar {
      width: 7px;
    }

    .list::-webkit-scrollbar-track {
      background: transparent;
    }

    .list::-webkit-scrollbar-thumb {
      background: #c7c7c7;
      border-radius: 10px;
    }

    /* SHOW ROW */

    .card {
      display: grid;

      grid-template-columns:
        minmax(220px, 1fr)
        minmax(120px, .45fr)
        auto;

      align-items: center;

      gap: 12px;

      padding: 8px 10px;
      margin-bottom: 5px;

      border: 1px solid #e1e1e1;
      border-left: 3px solid var(--gold);
      border-radius: 4px;

      background: #ffffff;

      transition:
        background .12s ease,
        border-color .12s ease;
    }

    .card:hover {
      background: #fafafa;
      border-color: #d3d3d3;
      border-left-color: var(--red);
    }

    .card-header {
      min-width: 0;
    }

    .show-name {
      margin: 0;

      color: var(--black);

      font-size: .91rem;
      line-height: 1.25;
      font-weight: 750;
    }

    .show-id {
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: var(--muted);

      font-size: .68rem;
      line-height: 1.25;
    }

    /* DOWNLOAD BUTTON */

    .btn-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;

      margin: 0;
    }

    .btn {
      min-height: 32px;

      padding: 0 11px;

      border: 1px solid #cccccc;
      border-radius: 4px;

      background: #ffffff;
      color: var(--muted);

      font-size: .72rem;
      font-weight: 700;

      text-decoration: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .btn-primary {
      border-color: var(--red);

      background: var(--red);
      color: #ffffff;

      font-weight: 800;

      white-space: nowrap;

      transition:
        background .15s ease,
        border-color .15s ease;
    }

    .btn-primary:hover {
      background: var(--red-dark);
      border-color: var(--red-dark);
    }

    /* BOTTOM NOTE */

    .hint {
      margin-top: 9px;
      padding-top: 8px;

      border-top: 1px solid #eeeeee;

      color: var(--muted);

      font-size: .70rem;
      line-height: 1.4;
    }

    .hint strong {
      color: #444444;
    }

    .empty {
      padding: 28px 10px;

      text-align: center;

      color: var(--muted);

      font-size: .85rem;
    }

    code {
      padding: 2px 4px;

      border-radius: 3px;

      background: #eeeeee;
      color: #333333;

      font-size: .78rem;
    }

    /* TABLET */

    @media (max-width: 800px) {

      .card {
        grid-template-columns:
          minmax(180px, 1fr)
          auto;
      }

      .show-id {
        display: none;
      }

    }

    /* MOBILE */

    @media (max-width: 600px) {

      .app {
        padding: 5px 6px 10px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;

        padding-bottom: 10px;
      }

      h1 {
        font-size: 1.15rem;
      }

      header p {
        font-size: .78rem;
      }

      .pill {
        display: none;
      }

      .panel {
        padding: 8px;
      }

      .top-row {
        align-items: stretch;
        flex-direction: column;
      }

      .search-box {
        width: 100%;
      }

      .count-label {
        text-align: right;
      }

      .list {
        max-height: 620px;
      }

      .card {
        grid-template-columns: 1fr;

        gap: 7px;

        padding: 9px 10px;
      }

      .show-name {
        font-size: .9rem;
      }

      .btn-row {
        justify-content: flex-start;
      }

      .btn-primary {
        width: 100%;
      }

    }
  </style>
</head>


<body>

  <div class="app">

    <header>

      <div class="title-wrap">

        <h1>
          <span class="logo-dot"></span>
          Golden Radio Hour – Show Downloads
        </h1>

        <p>
          Download complete old time radio show archives for your personal collection.
        </p>

      </div>

      <div class="pill">
        Full-show ZIP archives
      </div>

    </header>


    <section class="panel">

      <div class="top-row">

        <div class="search-box">

          <input
            id="searchInput"
            type="text"
            placeholder="Search shows…"
          />

          <button
            type="button"
            id="clearBtn"
          >
            Clear
          </button>

        </div>

        <div
          class="count-label"
          id="countLabel"
        >
          Loading…
        </div>

      </div>


      <div
        class="list"
        id="showList"
      ></div>


      <div class="hint">

        Tip: If your browser opens the ZIP instead of downloading it,
        right-click the download button and choose
        <strong>“Save link as…”</strong>.

      </div>

    </section>

  </div>


  <script>

    const JSON_URL =
      "zipped_shows.json";


    let allShows = [];

    let filteredShows = [];


    const showListEl =
      document.getElementById(
        "showList"
      );


    const searchInputEl =
      document.getElementById(
        "searchInput"
      );


    const clearBtnEl =
      document.getElementById(
        "clearBtn"
      );


    const countLabelEl =
      document.getElementById(
        "countLabel"
      );


    async function loadShows() {

      try {

        const res =
          await fetch(
            JSON_URL,
            {
              cache: "no-cache"
            }
          );


        if (!res.ok) {

          throw new Error(
            "HTTP " +
            res.status
          );

        }


        const data =
          await res.json();


        allShows =
          Array.isArray(data)
            ? data
            : [];


        filteredShows =
          [...allShows];


        renderList();

      }

      catch (err) {

        console.error(
          "Failed to load zipped_shows.json",
          err
        );


        showListEl.innerHTML = `

          <div class="empty">

            Could not load
            <code>zipped_shows.json</code>.

            <br/>

            Make sure it is in the same folder as this HTML file.

          </div>

        `;


        countLabelEl.textContent =
          "Error loading shows";

      }

    }


    function applyFilter() {

      const q =
        searchInputEl
          .value
          .trim()
          .toLowerCase();


      filteredShows =
        allShows.filter(
          show => {

            const id =
              (
                show.id ||
                ""
              )
              .toLowerCase();


            const name =
              (
                show.name ||
                ""
              )
              .toLowerCase();


            return (

              !q ||

              id.includes(q) ||

              name.includes(q)

            );

          }
        );


      renderList();

    }


    function safeName(show) {

      if (
        show.name &&
        show.name.trim().length > 0
      ) {

        return show.name;

      }


      return (
        show.id ||
        "Untitled Show"
      );

    }


    function renderList() {

      showListEl.innerHTML =
        "";


      if (!filteredShows.length) {

        showListEl.innerHTML = `

          <div class="empty">

            No shows match your search.

            <br/>

            Try clearing the search box.

          </div>

        `;


        countLabelEl.textContent =
          "0 shows";


        return;

      }


      filteredShows.forEach(
        show => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "card";


          const header =
            document.createElement(
              "div"
            );


          header.className =
            "card-header";


          const title =
            document.createElement(
              "h2"
            );


          title.className =
            "show-name";


          title.textContent =
            safeName(show);


          const idLabel =
            document.createElement(
              "div"
            );


          idLabel.className =
            "show-id";


          idLabel.textContent =
            show.id ||
            "";


          header.appendChild(
            title
          );


          const btnRow =
            document.createElement(
              "div"
            );


          btnRow.className =
            "btn-row";


          if (show.zipUrl) {

            const a =
              document.createElement(
                "a"
              );


            a.className =
              "btn btn-primary";


            a.href =
              encodeURI(
                show.zipUrl
              );


            a.setAttribute(
              "download",
              ""
            );


            a.textContent =
              "Download ZIP";


            btnRow.appendChild(
              a
            );

          }

          else {

            const span =
              document.createElement(
                "span"
              );


            span.className =
              "btn";


            span.textContent =
              "No ZIP available";


            btnRow.appendChild(
              span
            );

          }


          card.appendChild(
            header
          );


          card.appendChild(
            idLabel
          );


          card.appendChild(
            btnRow
          );


          showListEl.appendChild(
            card
          );

        }
      );


      countLabelEl.textContent =

        filteredShows.length +

        (
          filteredShows.length === 1
            ? " show"
            : " shows"
        );

    }


    searchInputEl.addEventListener(
      "input",
      applyFilter
    );


    clearBtnEl.addEventListener(
      "click",
      () => {

        searchInputEl.value =
          "";


        applyFilter();

      }
    );


    loadShows();

  </script>

</body>
</html>
